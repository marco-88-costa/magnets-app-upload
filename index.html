<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload da tua foto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      display: block;
      width: 110px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 18px auto;
    }

    h1, h2, h3 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    .form-group {
      text-align: left;
      margin: 16px auto;
      max-width: 420px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }

    #add_more_btn {
      display: none;
      background: #f0f0f0;
      color: #111;
      border: 1px solid #ccc;
    }

    #add_more_btn:hover {
      background: #e5e5e5;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #eef8ee;
      border: 1px solid #b7dfb7;
      border-radius: 10px;
      display: none;
    }

    #errorMessage {
      margin-top: 16px;
      padding: 12px;
      background: #fff2f2;
      border: 1px solid #e3b3b3;
      border-radius: 10px;
      color: #a33;
      display: none;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    #orderInfo {
      margin-top: 14px;
      font-size: 14px;
      color: #555;
      display: none;
    }

    #uploadsSection {
      display: none;
      margin-top: 28px;
      text-align: left;
    }

    #uploadsSection h3 {
      text-align: center;
      margin-bottom: 14px;
    }

    #uploadsList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #uploadsList li {
      background: #fafafa;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    #uploadsList a {
      color: #111;
    }

    .upload-count {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/logo.jpeg" alt="Logo da marca" class="logo" />
    <h2>Envia a tua fotografia</h2>
    <p>Preenche os teus dados e faz o upload da imagem.</p>
    <p>Tamanho: 5x5 cm.<br>Formatos suportados: .jpeg, .jpg, .png</p>

    <div class="form-group">
      abel for="customerName">Nome</label>
      <input type="text" id="customerName" placeholder="O teu nome" required />
    </div>

    <div class="form-group">
      abel for="customerEmail">Email</label>
      <input type="email" id="customerEmail" placeholder="teuemail@exemplo.com" required />
    </div>

    <div class="button-row">
      <button id="upload_widget" type="button">Escolher fotografia</button>
      <button id="add_more_btn" type="button">Adicionar outra fotografia</button>
    </div>

    <div id="errorMessage"></div>
    <div id="orderInfo"></div>
    <div id="result"></div>

    <div id="uploadsSection">
      <h3>Fotografias adicionadas</h3>
      <ul id="uploadsList"></ul>
      <div class="upload-count" id="uploadCount"></div>
    </div>
  </div>
<script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
<script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

<script>
  document.getElementById("upload_widget").addEventListener("click", function () {
    console.log("Clique detectado");

    cloudinary.openUploadWidget(
      {
        cloudName: "dambyxr7a",
        uploadPreset: "MVP_Magnet_Upload"
      },
      function(error, result) {
        console.log("ERROR:", error);
        console.log("RESULT:", result);
      }
    );
  });
</script>

</body>
</html>
