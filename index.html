<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload da tua foto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      display: block;
      width: 80px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 18px auto;
    }

    h1, h2 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #333;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #eef8ee;
      border: 1px solid #b7dfb7;
      border-radius: 10px;
      display: none;
    }

    #orderInfo {
      margin-top: 16px;
      padding: 12px 15px;
      background: #f3f3f3;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    #preview {
      margin-top: 20px;
      max-width: 250px;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/logo.jpeg" alt="Logo da marca" class="logo" />
    <h2>Envia a tua fotografia</h2>
    <p>Faz o upload da tua imagem e ajusta-a dentro da área quadrada de impressão.</p>
    <p>Tamanho: 5x5 cm.<br>Formatos suportados: .jpeg, .jpg, .png</p>

    <button id="upload_widget">Escolher</button>

    <div id="orderInfo"></div>
    <img id="preview" alt="Pré-visualização da imagem enviada" />
    <div id="result"></div>
  </div>

  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

  <script>
    let orderId = "";

    function generateOrderId() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const random = Math.floor(10000 + Math.random() * 90000);
      return MAG-${yyyy}${mm}${dd}-${random};
    }

    const myWidget = cloudinary.createUploadWidget(
      {
        cloudName: 'dambyxr7a',
        uploadPreset: 'MVP_Magnet_Upload',
        sources: ['local', 'camera'],
        multiple: false,
        resourceType: 'image',
        cropping: true,
        croppingAspectRatio: 1,
        showSkipCropButton: false,
        folder: 'magnet-uploads',
        clientAllowedFormats: ['jpg', 'jpeg', 'png', 'webp'],
        maxFileSize: 10000000
      },
      (error, result) => {
        if (!error && result && result.event === "success") {
          const imageUrl = result.info.secure_url;

          document.getElementById("preview").src = imageUrl;
          document.getElementById("preview").style.display = "block";

          document.getElementById("result").style.display = "block";
          document.getElementById("result").innerHTML =
            "Upload concluído com sucesso. Recebemos a tua imagem!<br><strong>Pedido:</strong> " + orderId;
        }
      }
    );

    document.getElementById("upload_widget").addEventListener("click", function () {
      if (!orderId) {
        orderId = generateOrderId();
      }

      document.getElementById("orderInfo").style.display = "block";
      document.getElementById("orderInfo").innerHTML =
        "<strong>Número da encomenda:</strong> " + orderId;

      myWidget.open();
    }, false);
  </script>
</body>
</html>
