<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload da tua foto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      display: block;
      width: 80px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 18px auto;
    }

    h1, h2, h3 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }

    #add_more_btn {
      display: none;
      background: #f0f0f0;
      color: #111;
      border: 1px solid #ccc;
    }

    #add_more_btn:hover {
      background: #e5e5e5;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #eef8ee;
      border: 1px solid #b7dfb7;
      border-radius: 10px;
      display: none;
    }

    #preview {
      margin-top: 20px;
      max-width: 250px;
      border-radius: 12px;
      display: none;
    }

    #orderInfo {
      margin-top: 15px;
      padding: 12px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    #uploadsSection {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    #uploadsSection h3 {
      text-align: center;
    }

    #uploadsList {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
    }

    #uploadsList li {
      background: #fafafa;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    #uploadCount {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/logo.jpeg" alt="Logo da marca" class="logo" />
    <h2>Envia a tua fotografia</h2>
    <p>Faz o upload da tua imagem e ajusta-a dentro da área quadrada de impressão.</p>
    <p>Tamanho: 5x5 cm.<br>Formatos suportados: .jpeg, .jpg, .png</p>

    <div class="button-row">
      <button id="upload_widget">Escolher</button>
      <button id="add_more_btn" type="button">Adicionar outra fotografia</button>
    </div>

    <div id="orderInfo"></div>
    <img id="preview" alt="Pré-visualização da imagem enviada" />
    <div id="result"></div>

    <div id="uploadsSection">
      <h3>Fotografias adicionadas</h3>
      <ul id="uploadsList"></ul>
      <div id="uploadCount"></div>
    </div>
  </div>

  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

  <script>
    const MAX_IMAGES = 6;
    let orderId = "";
    let uploadedImages = [];

    function generateOrderId() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const random = Math.floor(10000 + Math.random() * 90000);
      return "MAG-" + yyyy + mm + dd + "-" + random;
    }

    function updateButtons() {
      const reachedLimit = uploadedImages.length >= MAX_IMAGES;
      const addMoreBtn = document.getElementById("add_more_btn");
      const uploadBtn = document.getElementById("upload_widget");

      if (uploadedImages.length > 0) {
        addMoreBtn.style.display = "inline-block";
      }

      if (reachedLimit) {
        uploadBtn.disabled = true;
        addMoreBtn.disabled = true;
      }
    }

    function renderUploads() {
      const uploadsSection = document.getElementById("uploadsSection");
      const uploadsList = document.getElementById("uploadsList");
      const uploadCount = document.getElementById("uploadCount");

      uploadsSection.style.display = "block";
      uploadsList.innerHTML = "";

      uploadedImages.forEach((image, index) => {
        const li = document.createElement("li");
        li.innerHTML =
          "<strong>Fotografia " + (index + 1) + "</strong><br>" +
          "<a href='" + image.url + "' target='_blank' rel='noopener noreferrer'>Abrir imagem</a>";
        uploadsList.appendChild(li);
      });

      uploadCount.textContent = uploadedImages.length + " de " + MAX_IMAGES + " fotografia(s) adicionada(s) a este pedido.";
      updateButtons();
    }

    const myWidget = cloudinary.createUploadWidget(
      {
        cloudName: 'dambyxr7a',
        uploadPreset: 'MVP_Magnet_Upload',
        sources: ['local', 'camera'],
        multiple: false,
        resourceType: 'image',
        cropping: true,
        croppingAspectRatio: 1,
        showSkipCropButton: false,
        folder: 'magnet-uploads',
        clientAllowedFormats: ['jpg', 'jpeg', 'png', 'webp'],
        maxFileSize: 10000000
      },
      (error, result) => {
        if (!error && result && result.event === "success") {
          if (!orderId) {
            orderId = generateOrderId();
          }

          const imageUrl = result.info.secure_url;

          uploadedImages.push({
            url: imageUrl,
            publicId: result.info.public_id
          });

          document.getElementById("preview").src = imageUrl;
          document.getElementById("preview").style.display = "block";

          document.getElementById("orderInfo").style.display = "block";
          document.getElementById("orderInfo").innerHTML =
            "<strong>Número da encomenda:</strong> " + orderId;

          document.getElementById("result").style.display = "block";

          if (uploadedImages.length >= MAX_IMAGES) {
            document.getElementById("result").innerHTML =
              "Upload concluído com sucesso.<br><strong>Pedido:</strong> " + orderId +
              "<br>Atingiste o limite máximo de " + MAX_IMAGES + " fotografias.";
          } else {
            document.getElementById("result").innerHTML =
              "Upload concluído com sucesso.<br><strong>Pedido:</strong> " + orderId;
          }

          renderUploads();
        }
      }
    );

    document.getElementById("upload_widget").addEventListener("click", function () {
      if (uploadedImages.length >= MAX_IMAGES) return;
      myWidget.open();
    }, false);

    document.getElementById("add_more_btn").addEventListener("click", function () {
      if (uploadedImages.length >= MAX_IMAGES) return;
      myWidget.open();
    }, false);
  </script>
</body>
</html>
